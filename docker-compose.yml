services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - portal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://portal:portal@db:5432/portal?schema=public
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - portal-uploads:/app/data/uploads
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  portal-db:
  portal-uploads:
