# Dedicated site for captive.wirelesscom.org
# Install as its own file. Do not replace other sites-enabled files.
#
# Replace APP_PRIVATE_IP with the application server.
# Replace certificate paths if they are not Let's Encrypt.

server {
    listen 80;
    listen [::]:80;
    server_name captive.wirelesscom.org;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 302 https://captive.wirelesscom.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name captive.wirelesscom.org;

    ssl_certificate /etc/letsencrypt/live/captive.wirelesscom.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/captive.wirelesscom.org/privkey.pem;

    location / {
        proxy_pass http://APP_PRIVATE_IP:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
