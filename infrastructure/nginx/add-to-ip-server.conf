# Paste this INSIDE the existing server { } that already answers for
# 64.141.110.164 (or the default_server on port 80).
# Do not create a new default server. Do not remove other websites.
#
# UniFi's External Portal Server is an IP, so phones request:
#   http://64.141.110.164/guest/s/default/?ap=...&id=...&t=...&url=...&ssid=...
# captive.wirelesscom.org never sees that request unless this block exists.
#
# Replace APP_PRIVATE_IP with the Ubuntu application server address
# (the machine running deploy.sh), for example 10.0.0.12 or 127.0.0.1
# if NGINX and the app are on the same host.

location /guest {
    proxy_pass http://APP_PRIVATE_IP:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;
    proxy_read_timeout 30s;
}

location /branding {
    proxy_pass http://APP_PRIVATE_IP:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /media {
    proxy_pass http://APP_PRIVATE_IP:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/health {
    proxy_pass http://APP_PRIVATE_IP:3000;
    proxy_set_header Host $host;
}
